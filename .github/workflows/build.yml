name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build FMStreamDeck.exe
        shell: cmd
        run: server\build.bat

      # Optional code signing. Add these repository secrets to enable it:
      #   SIGN_PFX_BASE64   - your code-signing certificate (.pfx) encoded as base64
      #   SIGN_PFX_PASSWORD - the certificate password
      - name: Sign executable
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd sha256 /f $pfx /p $env:SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 FMStreamDeck.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item $pfx

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist\FM-Stream-Deck'
          New-Item -ItemType Directory -Force "$out\server" | Out-Null
          Copy-Item FMStreamDeck.exe, obs-deck.html, 'FM-Stream Deck.bat', README.md, LICENSE $out
          Copy-Item server\server.ps1, server\panel.html "$out\server"
          Compress-Archive -Path "$out\*" -DestinationPath dist\FM-Stream-Deck-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FM-Stream-Deck-windows
          path: dist/FM-Stream-Deck-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FM-Stream-Deck-windows.zip
          generate_release_notes: true
