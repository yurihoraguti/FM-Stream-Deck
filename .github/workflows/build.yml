name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # On a v* tag, write the tag's version into the sources so the release reports it
      # (and the built-in updater can compare it). Other builds keep 'dev', which turns the updater off.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got '${{ github.ref_name }}')" }
          function Set-Version([string]$file, [string]$pattern, [string]$value, [bool]$bom) {
            $text = [IO.File]::ReadAllText($file)
            if ($text -notmatch $pattern) { throw "Version marker not found in $file" }
            [IO.File]::WriteAllText($file, ($text -replace $pattern, $value), (New-Object Text.UTF8Encoding($bom)))
          }
          Set-Version 'server\server.ps1' "\`$Version = 'dev'" "`$Version = '$v'" $true
          Set-Version 'server\FMStreamDeck.cs' 'const string Version = "dev"' "const string Version = `"$v`"" $false
          Set-Version 'server\FMStreamDeck.cs' '"0\.0\.0\.0"' "`"$v.0`"" $false
          Write-Host "Version $v"

      # The standalone .exe is not shipped yet (it needs a paid code-signing certificate),
      # but we still compile it so the source keeps building.
      - name: Compile check (FMStreamDeck.exe)
        shell: cmd
        run: server\build.bat

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist\FM-Stream-Deck'
          New-Item -ItemType Directory -Force "$out\server" | Out-Null
          Copy-Item obs-deck.html, 'FM-Stream Deck.bat', README.md, LICENSE $out
          Copy-Item server\server.ps1, server\panel.html "$out\server"
          Compress-Archive -Path "$out\*" -DestinationPath dist\FM-Stream-Deck-windows.zip -Force

      - uses: actions/upload-artifact@v5
        with:
          name: FM-Stream-Deck-windows
          path: dist/FM-Stream-Deck-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FM-Stream-Deck-windows.zip
          generate_release_notes: true
          body: |
            ## Download
            **FM-Stream-Deck-windows.zip** — extract it and double-click **`FM-Stream Deck.bat`** (Windows 10/11, nothing to install).
            The management panel opens in your browser: scan the QR code with your phone to open the deck.
